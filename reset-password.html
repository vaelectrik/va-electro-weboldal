
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10100f">
  <title>VA ELECTRO – Új jelszó</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#10100f;color:#f5f1eb;font-family:Arial,sans-serif}
    .panel{width:100%;max-width:440px;padding:25px;background:#1b1a18;border:1px solid #39342f;border-radius:14px}
    .brand{font-size:23px;font-weight:bold;letter-spacing:1px;margin-bottom:25px}
    .brand span{color:#c58b58}
    h1{font-size:25px}
    p{color:#b8b0a7;line-height:1.5}
    label{display:block;margin:18px 0 8px;color:#b8b0a7}
    input{width:100%;padding:13px;border:1px solid #51483f;border-radius:7px;background:#111;color:#fff;font-size:16px}
    button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:7px;background:#c58b58;color:#17120d;font-weight:bold;font-size:16px}
    button:disabled{opacity:.6}
    #message{white-space:pre-wrap;overflow-wrap:anywhere}
    a{color:#c58b58}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><span>VA</span> ELECTRO</div>
    <h1>Új jelszó beállítása</h1>
    <p>Adj meg egy új jelszót az adminfiókodhoz.</p>

    <form id="resetForm">
      <label for="password">Új jelszó</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmPassword">Új jelszó ismét</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button id="saveButton" type="submit">Új jelszó mentése</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="./Admin.html">Vissza az admin belépéshez</a></p>
  </main>

  <script>
    const SUPABASE_URL = "https://fxxhxnpirxpjqadrwyzf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Zpk6zDDtgqFpkDc38ms6_g_gjzvn-ZS";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveButton");

    let recoverySessionReady = false;

    function showMessage(text) {
      message.textContent = text;
    }

    async function initializeRecovery() {
      showMessage("A visszaállító hivatkozás ellenőrzése...");

      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);

      const errorDescription =
        hash.get("error_description") ||
        query.get("error_description");

      if (errorDescription) {
        showMessage("A visszaállító hivatkozás hibás vagy lejárt. Kérj új jelszó-visszaállító e-mailt a Supabase-ből.");
        return;
      }

      const accessToken = hash.get("access_token");
      const refreshToken = hash.get("refresh_token");
      const tokenHash = query.get("token_hash");
      const type = hash.get("type") || query.get("type");

      try {
        if (accessToken && refreshToken) {
          const { error } = await client.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
        } else if (tokenHash && type === "recovery") {
          const { error } = await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          if (error) throw error;
        }

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (data.session) {
          recoverySessionReady = true;
          showMessage("A hivatkozás érvényes. Most megadhatod az új jelszavadat.");
        } else {
          showMessage("Nem található érvényes visszaállítási munkamenet. Kérj új jelszó-visszaállító e-mailt, és a link megnyitása után próbáld újra.");
        }
      } catch (error) {
        showMessage("A hivatkozást nem sikerült ellenőrizni. Lehet, hogy lejárt vagy már felhasználtad. Kérj új visszaállító e-mailt.");
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (!recoverySessionReady) {
        showMessage("Előbb nyisd meg a Supabase jelszó-visszaállító e-mailjében található érvényes hivatkozást.");
        return;
      }

      if (password.length < 8) {
        showMessage("A jelszó legalább 8 karakter legyen.");
        return;
      }

      if (password !== confirmation) {
        showMessage("A két jelszó nem egyezik.");
        return;
      }

      button.disabled = true;
      button.textContent = "Mentés...";

      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;

        showMessage("Az új jelszó sikeresen beállítva. Most már beléphetsz az adminfelületre.");
        form.reset();
        recoverySessionReady = false;
      } catch (error) {
        showMessage("Nem sikerült megváltoztatni a jelszót: " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Új jelszó mentése";
      }
    });

    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoverySessionReady = true;
        showMessage("A visszaállítás ellenőrizve. Most megadhatod az új jelszavadat.");
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
